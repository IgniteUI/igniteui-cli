<p>igxDateTimeEditor directive sample.</p>
<p>You can read more about configuring the igxDateTimeEditor directive in the
<a href="https://github.com/IgniteUI/igniteui-angular/blob/master/projects/igniteui-angular/directives/src/directives/date-time-editor/README.md" target="_blank">README</a> or the
<a href="https://www.infragistics.com/products/ignite-ui-angular/angular/components/date-time-editor.html" target="_blank">official documentation</a>.</p>
<igx-input-group>
  <label igxLabel for="dateEditor">Date</label>
  <input id="dateEditor" type="text" igxInput igxDateTimeEditor [(ngModel)]="date"/>
</igx-input-group>
