<p>igxMask directive sample.</p>
<p>You can read more about configuring the igxMask directive in the
<a href="https://github.com/IgniteUI/igniteui-angular/blob/master/projects/igniteui-angular/directives/src/directives/mask/README.md" target="_blank">README</a> or the
<a href="https://www.infragistics.com/products/ignite-ui-angular/angular/components/mask.html" target="_blank">official documentation</a>.</p>
<igx-input-group>
  <label igxLabel for="phone">Phone number</label>
  <input id="phone" type="text" igxInput [(ngModel)]="phoneNumber" [igxMask]="'(000) 0000-000'"/>
</igx-input-group>
