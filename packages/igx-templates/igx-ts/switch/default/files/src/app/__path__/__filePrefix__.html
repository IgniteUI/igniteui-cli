<p>igx-switch component sample.</p>
<p>You can read more about configuring the igx-switch component in the
<a href="https://github.com/IgniteUI/igniteui-angular/blob/master/projects/igniteui-angular/switch/README.md" target="_blank">README</a> or the
<a href="https://www.infragistics.com/products/ignite-ui-angular/angular/components/switch" target="_blank">official documentation</a>.</p>
<ul class="task-list">
  @for (task of tasks; track task.description) {
    <li>
      <igx-switch [(ngModel)]="task.done">{{ task.description }}</igx-switch>
    </li>
  }
</ul>
