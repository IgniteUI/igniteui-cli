<p>igx-linear-bar component sample.</p>
<p>You can read more about configuring the igx-linear-bar component in the
<a href="https://github.com/IgniteUI/igniteui-angular/blob/master/projects/igniteui-angular/progressbar/README.md" target="_blank">README</a> or the
<a href="https://www.infragistics.com/products/ignite-ui-angular/angular/components/linear-progress" target="_blank">official documentation</a>.</p>
<igx-linear-bar type="info" [value]="currentValue" [max]="100" [striped]="true" [textVisibility]="true"></igx-linear-bar>
<button type="button" igxButton="contained" (click)="increment()">Increment</button>
