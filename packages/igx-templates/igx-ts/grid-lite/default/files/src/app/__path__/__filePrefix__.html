<p>igx-grid-lite component sample.</p>
<p>You can read more about configuring the igx-grid-lite component in the
<a href="https://github.com/IgniteUI/igniteui-angular/blob/master/projects/igniteui-angular/grids/lite/README.md" target="_blank">README</a> or the
<a href="https://www.infragistics.com/products/ignite-ui-angular/angular/components/grid-lite/overview" target="_blank">official documentation</a>.</p>
<igx-grid-lite [data]="data">
  <igx-grid-lite-column field="id" header="ID" dataType="number"></igx-grid-lite-column>
  <igx-grid-lite-column field="firstName" header="First Name"></igx-grid-lite-column>
  <igx-grid-lite-column field="lastName" header="Last Name"></igx-grid-lite-column>
  <igx-grid-lite-column field="age" header="Age" dataType="number"></igx-grid-lite-column>
</igx-grid-lite>
