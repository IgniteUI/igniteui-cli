<p>igx-snackbar component sample.</p>
<p>You can read more about configuring the igx-snackbar component in the
<a href="https://github.com/IgniteUI/igniteui-angular/blob/master/projects/igniteui-angular/snackbar/README.md" target="_blank">README</a> or the
<a href="https://www.infragistics.com/products/ignite-ui-angular/angular/components/snackbar" target="_blank">official documentation</a>.</p>
<button type="button" igxButton="contained" (click)="snackbar.open()">Show snackbar</button>
<igx-snackbar
  message="This is a snackbar with a button and action!"
  actionName="Dismiss"
  (onAction)="snackbar.close()">
</igx-snackbar>
