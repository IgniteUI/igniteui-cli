<p>igx-checkbox component sample.</p>
<p>You can read more about configuring the igx-checkbox component in the
<a href="https://github.com/IgniteUI/igniteui-angular/blob/master/projects/igniteui-angular/checkbox/README.md" target="_blank">README</a> or the
<a href="https://www.infragistics.com/products/ignite-ui-angular/angular/components/checkbox.html" target="_blank">official documentation</a>.</p>
<ul class="task-list">
  @for (task of tasks; track task.description) {
    <li>
      <igx-checkbox [(ngModel)]="task.done">{{ task.description }}</igx-checkbox>
    </li>
  }
</ul>
